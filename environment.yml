name: ece6081
channels:
  - conda-forge
dependencies:
  - python=3.11
  - numpy
  - pandas
  - scipy
  - scikit-learn
  - matplotlib
  - seaborn
  - pyyaml
  - tqdm
  - jupyterlab
  - pip
  - pip:
      # GPU(CUDA 12.1)용. CPU만 쓸 경우 --index-url 줄을 지우면 된다.
      - --index-url https://download.pytorch.org/whl/cu121
      - --extra-index-url https://pypi.org/simple
      - torch
# 실험 시작 전 `conda env export --no-builds > environment.lock.yml`로 버전을 고정해 함께 커밋할 것.
