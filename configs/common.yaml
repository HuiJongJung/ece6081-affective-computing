# 모든 모델·조건·RQ가 공유하는 실험 설정. 값을 바꾸면 docs/decisions.md에도 반영할 것.

paths:
  raw_dir: data/raw/WESAD            # S2/S2.pkl ... S17/S17.pkl
  processed_dir: data/processed      # make_windows.py 출력 (git 제외)
  results_dir: results               # 제출용 CSV
  models_dir: outputs/models         # fold별 학습된 모델 (git 제외)

data:
  # WESAD 원본에는 S1, S12가 없음 -> 15명
  subjects: [S2, S3, S4, S5, S6, S7, S8, S9, S10, S11, S13, S14, S15, S16, S17]
  signals:
    eda: {source: wrist, fs: 4}
    bvp: {source: wrist, fs: 64}
  label_fs: 700   # 원본 라벨 샘플링 주파수

labels:
  # 원래 조건 -> 이진 정답. 목록에 없는 라벨(0, 4~7)은 학습·평가에서 제외
  map: {1: 0, 2: 1, 3: 0}   # 1 Baseline, 2 Stress, 3 Amusement
  names: {1: baseline, 2: stress, 3: amusement}

windows:
  length_s: 60
  step_s: 60
  origin: recording_start     # 기록 시작점 기준
  require_single_label: true  # 구간 내 원래 라벨이 모두 같아야 사용
  drop_incomplete_tail: true

evaluation:
  outer: loso
  inner:
    scheme: group_kfold       # 외부 학습 참가자 내부, 참가자 단위
    n_splits: 3
  metric: macro_f1            # 참가자별 계산 후 15명 평균 ± SD
  threshold: 0.5
  seed: 42

baseline:
  model: logistic_regression
  params: {C: 1.0, class_weight: balanced, max_iter: 2000}
  imputer: median             # 학습 자료 중앙값
  scaler: standard
